[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "btrfs-patrol"
version = "0.6.0"
description = "Btrfs snapshot manager and one-command rollback tool for Fedora"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Recovery Tools",
]

[project.scripts]
btrfs-patrol = "btrfs_patrol.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Read by config.example_text(); setup writes it as the starting configuration.
btrfs_patrol = ["config.toml.example"]
