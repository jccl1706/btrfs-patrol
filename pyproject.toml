[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "btrfs-patrol"
version = "0.8.0"
description = "Btrfs snapshot manager and one-command rollback tool for Fedora"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Recovery Tools",
]

[project.scripts]
btrfs-patrol = "btrfs_patrol.cli:main"
# Run through pkexec by the settings page to change the configuration, which is
# root's file. It imports nothing but btrfs_patrol.config, so it costs the
# command line tool nothing, and it is packaged with the GUI subpackage.
btrfs-patrol-gui-write-config = "btrfs_patrol.gui.confwrite:main"
# Reads the root-only snapshot store and prints metadata as JSON, so the window
# can show a list without running as root itself. Takes no arguments at all.
btrfs-patrol-gui-read = "btrfs_patrol.gui.readinfo:main"

# THE GUI IS OPTIONAL AND SEPARATE ON PURPOSE. The command line tool has no
# runtime dependencies at all, which is a feature on a machine you are repairing;
# PySide6 is tens of megabytes of Qt. So the front end is an extra rather than a
# requirement, and packaging should carry it as its own subpackage.
[project.optional-dependencies]
gui = ["PySide6"]

[project.gui-scripts]
btrfs-patrol-gui = "btrfs_patrol.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Read by config.example_text(); setup writes it as the starting configuration.
btrfs_patrol = ["config.toml.example", "gui/qml/*.qml"]
